# ====================================================================
# 情侣点餐系统 · Docker Compose 一键部署
#
# 用法：
#   1) cp .env.example .env        （Windows: copy .env.example .env）
#   2) 按需修改 .env（至少替换 JWT_SECRET）
#   3) docker compose up -d --build
#
# 拓扑：
#   浏览器 → frontend(nginx:80) → /api → backend(8081) → mysql(3306)
#   上传图片：./data/uploads ↔ backend:/app/uploads ↔ frontend:/app/uploads(ro)
#   日志：    ./logs ↔ backend:/app/logs
# ====================================================================

name: couple-ordering

services:
  # ---------- 数据库（首次启动自动执行 docs/init.sql 初始化） ----------
  mysql:
    image: mysql:8.0.41
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-couple_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-couple_ordering}
      MYSQL_USER: ${MYSQL_USER:-couple}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-couple123}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      # 数据持久化卷（删除卷 = 重新初始化，见 README）
      - mysql-data:/var/lib/mysql
      # 首次启动自动初始化；数据卷已存在时不会重复执行
      - ./docs/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - couple-net

  # ---------- 后端（Spring Boot 3.2 / Java 17，容器内 8081） ----------
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8081"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-couple_ordering}
      MYSQL_USER: ${MYSQL_USER:-couple}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-couple123}
      # 生产密钥必须通过 .env 提供（长度 >= 32 字节）
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET（openssl rand -hex 32）}
      JWT_EXPIRE: ${JWT_EXPIRE:-604800}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-SMTP}
      MAIL_ENCRYPTION_KEY: ${MAIL_ENCRYPTION_KEY:-}
      UPLOAD_DIR: /app/uploads
      LOG_PATH: /app/logs
      TZ: Asia/Shanghai
    volumes:
      # 上传图片持久化（前端 nginx 只读挂载同一目录）
      - ./data/uploads:/app/uploads
      # 后端日志持久化（按天切割，保留 7 天）
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8081/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - couple-net

  # ---------- 前端（nginx，对外暴露 WEB_PORT） ----------
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      # 只读挂载上传图片目录，由 nginx /uploads 直接托管
      - ./data/uploads:/app/uploads:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - couple-net

networks:
  couple-net:
    driver: bridge

volumes:
  mysql-data:
