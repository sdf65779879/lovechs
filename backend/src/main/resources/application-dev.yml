# ============ 开发环境（本地） ============
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:couple_ordering}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

mybatis-plus:
  configuration:
    # 本地开发打印 SQL，便于调试
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

couple:
  upload:
    dir: ${UPLOAD_DIR:./data/uploads}

logging:
  level:
    com.couple.ordering: debug
