server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /api
  shutdown: graceful

spring:
  application:
    name: couple-ordering
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 20s
  sql:
    init:
      mode: always
      schema-locations: classpath:db/email-schema.sql

# ============ MyBatis-Plus ============
mybatis-plus:
  type-aliases-package: com.couple.ordering.entity
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ============ 业务自定义配置 ============
couple:
  email:
    provider: ${EMAIL_PROVIDER:SMTP}
    encryption-key: ${MAIL_ENCRYPTION_KEY:}
  jwt:
    # 生产环境必须通过环境变量 JWT_SECRET 注入足够长的随机密钥（>= 32 字节）
    secret: ${JWT_SECRET:dev-local-only-secret-please-change-0123456789abcdef}
    # Token 有效期（秒），默认 7 天
    expire-seconds: ${JWT_EXPIRE:604800}
  upload:
    # 图片存储目录，dev 默认项目根目录 data/uploads
    dir: ${UPLOAD_DIR:./data/uploads}

# ============ 接口文档 ============
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: /v1/**
knife4j:
  enable: true
  setting:
    language: zh_cn
