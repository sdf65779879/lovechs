# ====================================================================
# 情侣点餐系统 · Nginx 站点配置（HTTP 默认形态）
#
# 职责：
#   /           前端静态资源（SPA history 回退到 index.html）
#   /api/       反向代理到后端容器 http://backend:8081（context-path=/api）
#   /uploads/   上传图片（与后端共享卷 /app/uploads，只读，长缓存）
#   /images/    前端内置占位图（长缓存）
#
# HTTPS 可选方案（自签证书 / Caddy / 云 LB）见 README「HTTPS 可选方案」，
# 也可直接使用同目录 nginx.https.conf.example 一键替换。
# ====================================================================

server {
    listen 80;
    server_name _;

    # 前端静态资源根目录
    root /usr/share/nginx/html;
    index index.html;

    # 上传大小上限：前端 5MB（后端为准），此处保留冗余
    client_max_body_size 20m;

    # ---------- 静态资源 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 内置占位图（随前端打包，长缓存）
    location /images/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # 打包产物（hash 文件名，可长缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ---------- 上传图片：与后端共享挂载卷（只读） ----------
    location /uploads/ {
        alias /app/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---------- 后端 API 反向代理 ----------
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---------- 压缩 ----------
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;
    gzip_vary on;
}
